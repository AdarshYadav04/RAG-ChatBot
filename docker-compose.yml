version: "3.9"

services:
  rag-chatbot:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: rag-chatbot
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - chroma_data:/app/chroma_db
      - chat_db:/app/chat_history.db
      - logs:/app/logs
      - uploads:/app/uploads
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

volumes:
  chroma_data:
  chat_db:
  logs:
  uploads:
